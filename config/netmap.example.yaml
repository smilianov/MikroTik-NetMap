# MikroTik-NetMap Configuration
# Copy to netmap.yaml and adjust for your network.
# Secrets: use ${ENV_VAR} references — expanded at load time.

server:
  host: 0.0.0.0
  port: 8585
  # Allowed CORS origins. NETMAP_CORS_ORIGINS (comma-separated) overrides this.
  # A warning is logged when "*" is combined with auth.enabled: false.
  cors_origins: ["*"]

# Ping monitor settings
ping:
  interval: 2          # seconds between pings per device
  timeout: 1           # seconds before ping considered lost

# Graduated color thresholds (customisable)
thresholds:
  - max_seconds: 35
    color: "#22C55E"    # green — online
    label: "Online"
  - max_seconds: 70
    color: "#FFFF00"    # bright yellow
    label: "Degraded"
  - max_seconds: 105
    color: "#FFD700"    # yellow
    label: ""
  - max_seconds: 135
    color: "#FF8C00"    # bright orange
    label: ""
  - max_seconds: 165
    color: "#FF6600"    # orange
    label: ""
  - max_seconds: 195
    color: "#CC4400"    # dark orange
    label: ""
  - max_seconds: 345
    color: "#EF4444"    # red — down
    label: "Down"

# RouterOS API defaults (applied to devices that don't override)
# api_type: "rest" (HTTPS port 443, RouterOS 7.1+),
#           "classic" (port 8728, RouterOS 6.49+),
#           "ssh" (port 22, any RouterOS — supports SSH key auth)
#
# TLS/SSH verification options (all can be overridden per device):
#   use_ssl: true             — encrypt Classic API traffic (needs the api-ssl
#                               service on the router, usually port 8729)
#   ssl_verify: true          — verify the device TLS certificate (rest/classic).
#                               Default false because RouterOS REST commonly uses
#                               self-signed certs; a warning is logged while off.
#   ssl_verify_hostname: true — verify the certificate hostname (classic).
#   known_hosts: ""           — SSH host-key verification file (opt-in). Set a
#                               path to enable verification; empty or "none"
#                               disables it (logs a warning).
api_defaults:
  username: admin
  api_type: classic          # "rest", "classic", or "ssh"
  port: 8728

# Device definitions
devices:
  # Example: password-based authentication (Classic API)
  - name: core-router
    host: 10.0.0.1
    type: router
    profile: ccr
    password: "${CORE_ROUTER_PASS}"
    map: main
    position: {x: 400, y: 200}

  - name: rack-switch-1
    host: 10.0.0.2
    type: switch
    profile: crs
    password: "${SWITCH_PASS}"
    map: main
    position: {x: 400, y: 400}

  # Example: SSH key-based authentication (no password needed)
  - name: branch-router
    host: 10.0.1.1
    type: router
    profile: edge
    api_type: ssh
    ssh_key_file: /app/config/ssh_keys/id_ed25519
    map: main
    position: {x: 700, y: 200}

# Map definitions (hierarchy)
maps:
  - name: main
    label: "Network Overview"

# Manual link definitions (auto-discovery fills the rest)
links:
  - from: core-router:ether1
    to: rack-switch-1:sfp-sfpplus1
    speed: 10000      # 10G
    type: wired

  - from: core-router:ether2
    to: branch-router:ether1
    speed: 1000       # 1G
    type: wired

# Traffic monitor settings
# Queries /interface on devices with API credentials to collect bandwidth data.
# Requires devices to have a password or SSH key configured.
traffic:
  enabled: true          # enable interface traffic collection
  interval: 10           # seconds between queries per device

# Auto-discovery settings
# Queries /ip/neighbor on devices that have API credentials (password or SSH key).
# Discovered topology is persisted to config/discovered_topology.json.
discovery:
  enabled: true          # enable MNDP/LLDP neighbor discovery
  interval: 300          # re-discover every N seconds (default: 300 = 5 min)
  protocols: [mndp, lldp]  # neighbor protocols (informational — RouterOS reports all)
  map: discovery         # map tab where discovered devices/links are shown
  map_label: Auto Discovery
  auto_add_devices: false   # if true, unknown neighbors are added to the map
  auto_add_links: true      # if true, discovered links appear on the map

# Optional Grafana-based authentication (disabled by default).
# WARNING: with auth disabled, the mutation API and WebSocket are fully open —
# a prominent startup warning is logged.
# auth:
#   enabled: true
#   grafana_url: "http://localhost:3000"
#   grafana_verify_ssl: true    # verify Grafana's TLS certificate (default: true)
#   session_ttl: 28800          # session lifetime in seconds (8 hours)
#   # cookie_secure: true       # force session cookie Secure flag
#                               # (unset = auto from request scheme)
#   trust_proxy_headers: false  # trust X-Forwarded-* from a reverse proxy
# Login is rate-limited to 5 attempts per 60s per client IP (HTTP 429).
